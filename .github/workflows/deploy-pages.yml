name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check application rules
        run: pnpm test

      - name: Restore latest public market snapshot
        shell: bash
        run: |
          # Deploy only reads the data branch; update-market is its sole writer.
          # This preserves useful fallback data without racing scheduled updates.
          if git fetch --no-tags origin refs/heads/market-data:refs/remotes/origin/market-data && git show origin/market-data:market.json > "$RUNNER_TEMP/restored-market.json"; then
            cp "$RUNNER_TEMP/restored-market.json" public/data/market.json
            echo 'Restored latest public snapshot before collecting deployment data.'
          else
            echo '::notice::No public snapshot could be restored. Initial deployment requires successful feed collection.'
          fi

      - name: Generate research and initial market snapshot
        run: |
          pnpm content:generate
          node scripts/update-market-data.mjs --require-data

      - name: Build static site
        shell: bash
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          if [[ -s public/CNAME ]]; then
            CUSTOM_DOMAIN="$(tr -d '\r\n' < public/CNAME)"
            BASE_PATH=""
            SITE_URL="https://${CUSTOM_DOMAIN}"
          elif [[ "$REPO_NAME" == "${GITHUB_REPOSITORY_OWNER}.github.io" ]]; then
            BASE_PATH=""
            SITE_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io"
          else
            BASE_PATH="/${REPO_NAME}"
            SITE_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPO_NAME}"
          fi
          GITHUB_PAGES=true PAGES_BASE_PATH="$BASE_PATH" NEXT_PUBLIC_SITE_URL="$SITE_URL" pnpm exec next build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
