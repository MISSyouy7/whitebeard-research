content:
  - name: articles
    label: 研究文章
    type: collection
    path: content/articles
    filename: "{fields.slug}.md"
    view:
      fields: [title, status, categorySlug, date, featured]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: slug
        label: 文章网址代号
        type: string
        description: 只使用英文小写、数字和短横线，例如 ai-chip-cycle。
        required: true
        pattern:
          regex: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          message: 只能填写英文小写、数字和短横线。
      - name: title
        label: 文章标题
        type: string
        required: true
      - name: status
        label: 发布状态
        type: select
        default: draft
        required: true
        description: 写作时保持草稿；全部核验完成后再选择正式发布。
        options:
          values:
            - value: draft
              label: 草稿（官网不可见）
            - value: published
              label: 正式发布
      - name: description
        label: 首页摘要
        type: text
        description: 用一到两句话说明研究对象、核心问题和当前结论。
        required: true
      - name: date
        label: 发布日期
        type: date
        required: true
      - name: categorySlug
        label: 文章分类
        type: select
        required: true
        options:
          values:
            - value: ai-compute-hardware
              label: AI算力与硬件
            - value: embodied-intelligence
              label: 具身智能
            - value: physical-ai-applications
              label: 物理AI与应用
            - value: company-industry-tracking
              label: 公司与产业跟踪
            - value: research-methods
              label: 研究方法
      - name: tags
        label: 标签
        type: string
        list: true
        required: true
      - name: readingTime
        label: 预计阅读分钟数
        type: number
        default: 8
        required: true
      - name: featured
        label: 首页重点推荐
        type: boolean
        default: false
      - name: issue
        label: 研究编号
        type: string
        default: "000"
        description: 使用三位数字，例如 001。
        required: true
      - name: body
        label: 正文
        type: rich-text
        required: true
        default: |
          用不超过150字说明研究对象、核心问题和当前结论。

          ## 已确认事实

          - 【事实】待填写。来源：机构或公司，《材料标题》，发布日期，[链接](https://example.com)。

          ## 当前判断及依据

          - 【判断】待填写，并说明证据、关键假设和证据强弱。

          ## 尚未证实的推测

          - 【推测】暂无，或写明尚待核验的线索与核验路径。

          ## 反方观点与证伪条件

          - 反方观点：待填写。
          - 证伪条件：待填写可观察、可更新的条件。

          ## 风险提示

          - 待填写需求、价格、竞争、技术、财务、监管或估值风险。

          ## 后续跟踪指标

          - 指标：当前状态；更新频率；触发阈值。

          ## 来源

          - 机构或公司，《材料标题》，发布日期，[原文](https://example.com)。

          仅作研究交流，不构成投资建议。
  - name: weekly
    label: 每周研究跟踪
    type: collection
    path: content/weekly
    filename: "{fields.slug}.md"
    view:
      fields: [title, status, state, startDate, endDate]
      primary: title
      sort: [startDate, title]
      default:
        sort: startDate
        order: desc
    fields:
      - name: slug
        label: 周报网址代号
        type: string
        description: 例如 weekly-002。
        required: true
        pattern:
          regex: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          message: 只能填写英文小写、数字和短横线。
      - name: title
        label: 本周核心问题
        type: string
        required: true
      - name: status
        label: 发布状态
        type: select
        default: draft
        required: true
        description: 写作时保持草稿；确认后再选择正式发布。
        options:
          values:
            - value: draft
              label: 草稿（官网不可见）
            - value: published
              label: 正式发布
      - name: description
        label: 本周研究说明
        type: text
        required: true
      - name: startDate
        label: 开始日期
        type: date
        required: true
      - name: endDate
        label: 结束日期
        type: date
        required: true
      - name: issue
        label: 周次编号
        type: string
        default: "001"
        description: 使用三位数字，例如 002。
        required: true
      - name: state
        label: 当前状态
        type: select
        default: 准备中
        required: true
        options:
          values:
            - value: 准备中
              label: 准备中
            - value: 跟踪中
              label: 跟踪中
            - value: 已复盘
              label: 已复盘
      - name: focus
        label: 覆盖方向
        type: string
        list: true
        required: true
      - name: body
        label: 本周跟踪正文
        type: rich-text
        required: true
        default: |
          简要说明本周为什么研究这个问题。

          ## 本周核心问题

          待填写。

          ## 本周先做什么

          - 待填写。

          ## 当前研究状态

          - 【事实】待填写。
          - 【判断】待填写。
          - 【推测】暂无，或写明待验证线索。

          ## 本周更新节奏

          - 待填写。

          ## 风险与边界

          - 待填写。

          仅作研究交流，不构成投资建议。
